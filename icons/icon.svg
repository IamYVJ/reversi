<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Reversi">
  <!-- Green felt, full bleed. The board is the one surface in this app that
       does not use the shared chrome palette, and the icon follows it: a
       picture of a physical object, not a piece of UI. -->
  <rect width="512" height="512" fill="#1F6B4B"/>
  <radialGradient id="felt" cx="50%" cy="0%" r="110%">
    <stop offset="0" stop-color="#2A7E5A"/>
    <stop offset="0.65" stop-color="#175540"/>
  </radialGradient>
  <rect width="512" height="512" fill="url(#felt)"/>

  <!-- A 4x4 hint of the grid: lines every 80 units from 96 to 416, so the cell
       centres land on 136 / 216 / 296 / 376. Not eight cells — at 192px the
       thinner lines collapse into noise, and four still reads unmistakably as
       a squared board. -->
  <g stroke="#000000" stroke-opacity="0.34" stroke-width="3">
    <path d="M96 96H416M96 176H416M96 256H416M96 336H416M96 416H416"/>
    <path d="M96 96V416M176 96V416M256 96V416M336 96V416M416 96V416"/>
  </g>

  <!-- The opening four, in the middle four cells and in their real
       arrangement: white on the leading diagonal, black on the other. Anyone
       who has played the game recognises this position instantly, which is
       the whole job of the mark. -->
  <g>
    <circle cx="216" cy="216" r="30" fill="#F2F0E7"/>
    <circle cx="296" cy="296" r="30" fill="#F2F0E7"/>
    <circle cx="296" cy="216" r="30" fill="#14161D"/>
    <circle cx="216" cy="296" r="30" fill="#14161D"/>
  </g>

  <!-- The same non-colour markers the board itself uses — a ring on black, a
       bar on white — so the two stay distinguishable by shape and not by
       colour alone. -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="3">
    <circle cx="296" cy="216" r="10"/>
    <circle cx="216" cy="296" r="10"/>
  </g>
  <g fill="#000000" fill-opacity="0.36">
    <rect x="204.6" y="212.4" width="22.8" height="7.2" rx="1"/>
    <rect x="284.6" y="292.4" width="22.8" height="7.2" rx="1"/>
  </g>
</svg>
